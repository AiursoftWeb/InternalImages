stages:
  - test
  - deploy

test_codexproxy:
  stage: test
  script:
    - |
      set -o pipefail
      # 通过 stdin 传入源码，兼容 Runner 与 Docker daemon 不共享文件系统的情况。
      tar -C "$CI_PROJECT_DIR" -cf - CodexProxy |
        docker run --rm -i \
        -w /tmp python:3.13-slim sh -ec '
          mkdir -p /workspace
          tar -xf - -C /workspace
          cp -r /workspace/CodexProxy/source /tmp/codex-proxy
          python /workspace/CodexProxy/patch_responses.py /tmp/codex-proxy/codex_proxy/server.py
          python -m pip install /tmp/codex-proxy pytest pytest-asyncio
          cd /workspace
          python -c '\''import sys; from pathlib import Path; import codex_proxy.server as server; assert Path(server.__file__).is_relative_to(Path(sys.prefix)); assert "id" not in server._normalize_responses_input([{"type": "function_call", "id": "fc_call_test", "call_id": "call_test"}])[0]'\''
          python -m pytest -c CodexProxy/source/pyproject.toml \
            CodexProxy/source/tests/test_server.py \
            CodexProxy/source/tests/test_translator.py \
            CodexProxy/test_responses_patch.py -q
          python -m pytest -c CodexProxy/source/pyproject.toml CodexProxy/test_sitecustomize.py -q
        '
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - CodexProxy/**/*
        - .gitlab-ci.yml

.deploy_template:
  stage: deploy
  variables:
    PLATFORMS: "linux/amd64,linux/arm64"
  before_script:
    - if [[ "$CI_PROJECT_NAMESPACE" != "aiursoft" ]]; then
        echo "CI pipeline will only run for the Aiursoft namespace.";
        exit 1;
      fi
    - echo "Logging in to Docker Registry..."
    - echo "$LOCAL_DOCKER_PASSWORD" | docker login hub.aiursoft.com -u "$LOCAL_DOCKER_USERNAME" --password-stdin
    - docker buildx use aiur-global-builder
  script:
    - IMAGE_TARGET="hub.aiursoft.com/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME/$IMAGE_NAME:latest"
    - echo "Building image $IMAGE_TARGET"
    - docker buildx build "$CONTEXT" --platform "$PLATFORMS" -t "$IMAGE_TARGET" --push
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

deploy_anduinos_internal:
